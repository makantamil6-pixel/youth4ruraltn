<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Youth4RuralTN</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:
"Segoe UI",
Arial,
sans-serif;

background:
linear-gradient(135deg,#eef9f5,#f7fbff);

height:100vh;

display:flex;

justify-content:center;

align-items:center;

color:#1f2937;

}

.card{

background:#ffffff;

padding:60px;

border-radius:24px;

box-shadow:
0 15px 40px rgba(0,0,0,.10);

max-width:700px;

width:90%;

text-align:center;

}

.logo{

font-size:54px;

font-weight:800;

color:#0b6b50;

margin-bottom:15px;

}

h1{

font-size:40px;

margin-bottom:20px;

}

p{

font-size:20px;

line-height:1.8;

margin-bottom:40px;

color:#64748b;

}

.buttons{

display:flex;

justify-content:center;

gap:25px;

flex-wrap:wrap;

}

.btn{

display:inline-block;

padding:18px 36px;

border-radius:12px;

font-size:20px;

font-weight:700;

text-decoration:none;

transition:.3s;

}

.english{

background:#0b6b50;

color:#fff;

}

.english:hover{

background:#09513d;

}

.tamil{

background:#2c7be5;

color:#fff;

}

.tamil:hover{

background:#1e63bf;

}

footer{

margin-top:40px;

font-size:15px;

color:#64748b;

}

@media(max-width:768px){

.card{

padding:35px;

}

h1{

font-size:30px;

}

p{

font-size:18px;

}

.btn{

width:100%;

}

}

</style>

</head>

<body>

<div class="card">

<div class="logo">

RIE

</div>

<h1>

Youth4RuralTN

</h1>

<p>

Welcome to the Rural Integrated Economy initiative.

Please choose your preferred language to continue.

</p>

<div class="buttons">

<a class="btn english" href="en/index.html">

English

</a>

<a class="btn tamil" href="ta/index.html">

தமிழ்

</a>

</div>

<footer>

&copy; 2026 Youth4RuralTN • Rural Integrated Economy

</footer>

</div>

</body>

</html>
